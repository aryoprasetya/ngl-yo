  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --pink: #e83e8c;
      --pink-dark: #c92d75;
      --pink-light: #fff0f7;
      --text: #29232b;
      --muted: #938994;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 15%, #ffe4f1 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #ffeaf4 0, transparent 32%),
        #fffafd;
      font-family: 'Nunito', sans-serif;
      color: var(--text);
    }

    /* Dekorasi background */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
      opacity: .55;
    }

    .orb-1 {
      width: 260px;
      height: 260px;
      top: -100px;
      right: -80px;
      background: #ffd1e6;
    }

    .orb-2 {
      width: 220px;
      height: 220px;
      bottom: -100px;
      left: -70px;
      background: #fbd6eb;
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(100% - 40px, 400px);
      text-align: center;
      padding: 45px 30px;
      animation: containerIn .8s ease both;
    }

    /* Logo */
    .logo-wrap {
      width: 112px;
      height: 112px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 32px;
      box-shadow:
        0 15px 40px rgba(232, 62, 140, .13),
        0 3px 12px rgba(40, 20, 30, .04);
      animation: logoIn 1s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      border-radius: 22px;
    }

    /* Nama brand */
    .brand {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1.2px;
      margin: 0;
    }

    .brand span {
      color: var(--pink);
    }

    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      font-weight: 700;
      letter-spacing: .4px;
    }

    /* Status loading */
    .loading-section {
      margin-top: 45px;
    }

    .loading-text {
      font-size: 13px;
      color: #756b76;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .loading-track {
      width: 180px;
      height: 5px;
      border-radius: 99px;
      background: #f5dce9;
      margin: auto;
      overflow: hidden;
    }

    .loading-bar {
      width: 35%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #f49ac5, #e83e8c);
      animation: loading 2.2s ease-in-out infinite;
    }

    .footer {
      margin-top: 55px;
      font-size: 11px;
      font-weight: 700;
      color: #b2a7b1;
      letter-spacing: .6px;
    }

    .manual-link {
      display: inline-block;
      margin-top: 22px;
      color: var(--pink-dark);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      opacity: 0;
      animation: fadeIn .5s ease 1.5s forwards;
    }

    .manual-link:hover {
      text-decoration: underline;
    }

    /* Animasi */
    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }
      50% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(300%);
      }
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.85);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes containerIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .container {
        padding: 35px 20px;
      }

      .logo-wrap {
        width: 100px;
        height: 100px;
        border-radius: 28px;
      }

      .logo {
        width: 75px;
        height: 75px;
      }

      .brand {
        font-size: 29px;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

.ma-appearance-panel.open{display:block;animation:maPanelIn .18s ease both}

.ma-appearance-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}

.ma-appearance-label{display:block;font-size:11px;font-weight:900;color:var(--ma-muted);margin:13px 0 8px;text-transform:uppercase;letter-spacing:.55px}
.ma-appearance-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ma-appearance-mode{border:1px solid var(--ma-border);border-radius:10px;padding:10px 8px;background:var(--ma-bg);color:var(--ma-text);display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;cursor:pointer}

<script id="myanjem-appearance-manager">
(function(){
  const STORE='myanjem-appearance-v1';
  const colors=[
    {name:'Pink',hex:'#e83e8c'},{name:'Ungu',hex:'#8756c7'},{name:'Biru',hex:'#3978d4'},
    {name:'Teal',hex:'#159b91'},{name:'Hijau',hex:'#319b65'},{name:'Oranye',hex:'#e58a35'}
  ];
  const $=(id)=>document.getElementById(id);
  const validHex=v=>/^#[0-9a-f]{6}$/i.test(String(v||''));
  function shade(hex,amount){const h=hex.replace('#','');const n=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));return '#'+n.map(v=>Math.max(0,Math.min(255,Math.round(v*(1-amount)))).toString(16).padStart(2,'0')).join('')}
  function mix(hex,other,ratio){const a=hex.slice(1).match(/.{2}/g).map(x=>parseInt(x,16)),b=other.slice(1).match(/.{2}/g).map(x=>parseInt(x,16));return '#'+a.map((v,i)=>Math.round(v*(1-ratio)+b[i]*ratio).toString(16).padStart(2,'0')).join('')}
  function read(){try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');return {theme:x.theme==='dark'?'dark':'light',accent:validHex(x.accent)?x.accent:'#e83e8c'}}catch(e){return {theme:'light',accent:'#e83e8c'}}}
  let state=read();
  function apply(save=true){const root=document.documentElement;const dark=state.theme==='dark';root.dataset.maTheme=state.theme;
    const accent=state.accent;root.style.setProperty('--pink',accent);root.style.setProperty('--pink-dark',shade(accent,.18));root.style.setProperty('--pink-soft',mix(accent,'#ffffff',.91));root.style.setProperty('--pink-pale',mix(accent,'#ffffff',.96));root.style.setProperty('--pink-light',mix(accent,'#ffffff',.9));root.style.setProperty('--ma-accent',accent);root.style.setProperty('--ma-accent-dark',shade(accent,.18));root.style.setProperty('--ma-accent-soft',mix(accent,'#ffffff',dark?.82:.91));root.style.setProperty('--ma-accent-pale',mix(accent,'#ffffff',dark?.9:.96));
    document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.content=dark?'#151219':accent);
    document.querySelectorAll('.ma-appearance-mode').forEach(b=>b.classList.toggle('active',b.dataset.theme===state.theme));
    document.querySelectorAll('.ma-color-swatch').forEach(b=>b.classList.toggle('active',b.dataset.color.toLowerCase()===accent.toLowerCase()));
    const custom=$('maCustomColor');if(custom)custom.value=accent;const name=$('maColorName');if(name)name.textContent=(colors.find(c=>c.hex.toLowerCase()===accent.toLowerCase())?.name||'Kustom')+' · '+accent.toUpperCase();
    const trigger=$('maAppearanceToggle');if(trigger){trigger.setAttribute('aria-label',dark?'Ganti ke mode terang':'Ganti ke mode gelap');trigger.innerHTML=dark?'<i class="bx bx-sun"></i>':'<i class="bx bx-moon"></i>'}
    if(save){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
  }
  function build(){if($('maAppearanceToggle'))return;
    const swatches=colors.map(c=>`<button type="button" class="ma-color-swatch" style="background:${c.hex}" data-color="${c.hex}" title="Tema ${c.name}" aria-label="Tema warna ${c.name}"></button>`).join('');
    document.body.insertAdjacentHTML('beforeend',`<button id="maAppearanceToggle" class="ma-appearance-toggle" type="button" aria-label="Pengaturan tampilan" aria-expanded="false" aria-controls="maAppearancePanel"><i class="bx bx-moon"></i></button><section id="maAppearancePanel" class="ma-appearance-panel" aria-label="Pengaturan tampilan"><div class="ma-appearance-head"><b><i class="bx bx-palette"></i> Tampilan MyAnjem</b><button class="ma-appearance-close" id="maAppearanceClose" type="button" aria-label="Tutup">×</button></div><span class="ma-appearance-label">Mode tampilan</span><div class="ma-appearance-modes"><button type="button" class="ma-appearance-mode" data-theme="light"><i class="bx bx-sun"></i> Terang</button><button type="button" class="ma-appearance-mode" data-theme="dark"><i class="bx bx-moon"></i> Gelap</button></div><span class="ma-appearance-label">Warna utama</span><div class="ma-color-swatches">${swatches}</div><span class="ma-appearance-label">Warna pilihan sendiri</span><label class="ma-custom-color"><input id="maCustomColor" type="color" value="#e83e8c" aria-label="Pilih warna utama"><span id="maColorName">Pink · #E83E8C</span></label><p class="ma-appearance-note">Preferensi tampilan tersimpan di perangkat ini dan digunakan pada seluruh halaman MyAnjem.</p></section>`);
    const toggle=$('maAppearanceToggle'),panel=$('maAppearancePanel');
    toggle.addEventListener('click',()=>{const open=panel.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open))});
    $('maAppearanceClose').addEventListener('click',()=>{panel.classList.remove('open');toggle.setAttribute('aria-expanded','false')});
    panel.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.theme;apply()}));
    panel.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{state.accent=b.dataset.color;apply()}));
    $('maCustomColor').addEventListener('input',e=>{state.accent=e.target.value;apply()});
    document.addEventListener('click',e=>{if(panel.classList.contains('open')&&!panel.contains(e.target)&&!toggle.contains(e.target)){panel.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
    apply(false);
  }
  apply(false);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build,{once:true});else build();
  window.addEventListener('storage',e=>{if(e.key===STORE){state=read();apply(false)}});
})();
</script>

</body>
</html>
